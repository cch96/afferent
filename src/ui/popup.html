<!doctype html>
<html><head><meta charset="utf-8"><title>Afferent</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="popup.css"></head>
<body class="popup">
<header>
  <span class="wordmark">Afferent</span>
  <div class="tools">
    <button type="button" id="pause" class="pill-btn" hidden><span class="pill">
      <svg class="i-pause" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M9 6v12"/><path d="M15 6v12"/></svg>
      <svg class="i-play" width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5.5v13l11-6.5z"/></svg>
      <span id="pauseLabel"></span></span></button>
    <button type="button" id="del" class="round-btn"><span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.5 7h15"/><path d="M9.5 7V4.8h5V7"/><path d="M6.5 7l.9 12.2h9.2L17.5 7"/></svg></span></button>
    <button type="button" id="settings" class="round-btn"><span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h10"/><path d="M18 7h2"/><path d="M4 17h2"/><path d="M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg></span></button>
  </div>
</header>
<section id="card">
  <div id="fill" aria-hidden="true"></div>
  <div class="body">
    <div class="text">
      <div class="big"><svg id="done" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg><span id="big"></span></div>
      <div id="sub"></div>
    </div>
    <button type="button" id="action" class="pill-btn" hidden><span class="pill" id="actionLabel"></span></button>
  </div>
</section>
<div id="banner" role="status" hidden>
  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7.5v5.5"/><path d="M12 16.5v.01"/></svg>
  <span id="bannerText"></span>
  <button type="button" id="bannerBtn"></button>
</div>
<div id="head">
  <h2 id="count"></h2>
  <span id="delivered" hidden><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg><span data-i18n="popDelivered"></span></span>
</div>
<div id="forget" role="status" hidden></div>
<ul id="rows"></ul>
<div id="notice" role="status"></div>
<dialog id="delDlg" aria-labelledby="delTitle" aria-describedby="delWhat">
  <h2 id="delTitle" data-i18n="popDelTitle"></h2>
  <div id="delRanges">
    <button type="button" data-r="15" data-i18n="popLast15"></button>
    <button type="button" data-r="hour" data-i18n="popLastHour"></button>
    <button type="button" data-r="today" data-i18n="popDelToday"></button>
    <button type="button" data-r="all" data-i18n="popDelAll"></button>
  </div>
  <p id="delWhat"></p>
  <div class="btns">
    <button type="button" id="delNo" data-i18n="setCancel"></button>
    <button type="button" id="delGo" data-i18n="popDelete"></button>
  </div>
</dialog>
<template id="dots"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5.5" cy="12" r="1.9"/><circle cx="12" cy="12" r="1.9"/><circle cx="18.5" cy="12" r="1.9"/></svg></template>
<script type="module" src="popup.js"></script>
</body></html>
