<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Afferent</title>
<link rel="stylesheet" href="style.css"><link rel="stylesheet" href="connect.css"><link rel="stylesheet" href="onboarding.css"></head>
<body class="onb">
<section class="hero">
  <div class="rise" aria-hidden="true"></div>
  <div class="hero-in">
    <span class="mark" aria-hidden="true"></span>
    <div><div class="name">Afferent</div><p class="tagline" data-i18n="onbTagline"></p></div>
  </div>
</section>
<main>
  <div id="setup"></div>
  <div id="done" class="done" hidden>
    <svg width="76" height="76" viewBox="0 0 76 76" aria-hidden="true"><circle cx="38" cy="38" r="38" fill="#EFA47E"/><path d="M23 39l10 10 20-21" fill="none" stroke="#45362D" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <h1 id="done-title"></h1>
    <div class="pin">
      <span data-i18n="onbPinClick"></span>
      <span class="ico"><svg id="puzzle" role="img" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4h4v3a2 2 0 1 0 4 0V4h3v6h-3a2 2 0 1 0 0 4h3v6H4V10h5a2 2 0 1 0 0-4z"/></svg></span>
      <span data-i18n="onbPinThen"></span>
      <span class="ico"><svg id="pin" role="img" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4h6l-1 6 3 3v2H7v-2l3-3z"/><path d="M12 15v6"/></svg></span>
      <span data-i18n="onbPinTail"></span>
    </div>
    <div class="c-actions">
      <button type="button" id="finish" class="c-btn" data-i18n="onbFinish"></button>
    </div>
  </div>
</main>
<script type="module" src="onboarding.js"></script>
</body></html>
